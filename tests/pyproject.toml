[project]
name = "ecommerce-tests"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["."]
pythonpath = ["../services/auth-service", "../services/product-service", "../services/order-service", "../services/payment-service"]
